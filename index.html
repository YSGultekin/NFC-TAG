<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uğur Otomotiv</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .kart {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .isim {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .etiket {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        .iban {
            background: #f5f5f5;
            padding: 18px 12px;
            border-radius: 10px;
            font-size: 17px;
            word-break: break-word;
            cursor: pointer;
            transition: 0.2s;
        }
        .iban:active {
            transform: scale(0.97);
            background: #e8e8e8;
        }
        .mesaj {
            margin-top: 12px;
            color: #228B22;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .mesaj.goster {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="kart">
        <h1>UĞUR OTOMOTİV</h1>
        <div class="isim">
            Ahmet Yılmaz
        </div>
        <div class="etiket">
            IBAN
        </div>
        <div class="iban" onclick="ibanKopyala()">
            TR00 0000 0000 0000 0000 0000 00
        </div>
        <div class="mesaj" id="mesaj">
            IBAN kopyalandı ✓
        </div>
    </div>
    <script>
        function ibanKopyala() {
            const iban = "TR000000000000000000000000";
            navigator.clipboard.writeText(iban).then(function() {
                const mesaj = document.getElementById("mesaj");
                mesaj.classList.add("goster");
                setTimeout(function() {
                    mesaj.classList.remove("goster");
                }, 2000);
            });
        }
    </script>
</body>
</html>
